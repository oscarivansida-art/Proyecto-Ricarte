<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario General - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/modo-oscuro.css">
    <script src="../js/modo-oscuro.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full text-slate-700 font-sans bg-slate-100">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center gap-3 text-brand-600 font-bold text-lg pb-6 border-b border-slate-200">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                    <span>AdminPanel</span>
                </div>
                <nav class="flex flex-col gap-1.5 mt-6">
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-500 hover:text-brand-700 hover:bg-brand-50 font-medium text-sm rounded-xl transition-all">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="usuarios.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-500 hover:text-brand-700 hover:bg-brand-50 font-medium text-sm rounded-xl transition-all">
                        <i class="fa-solid fa-users"></i>
                        <span>Usuarios y Roles</span>
                    </a>
                    <a href="inventario.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand-50 text-brand-600 font-medium text-sm rounded-xl border border-brand-100">
                        <i class="fa-solid fa-box-archive"></i>
                        <span>Inventario General</span>
                    </a>
                </nav>
            </div>
            <button onclick="logout()" class="w-full py-2.5 px-3 bg-slate-50 hover:bg-red-50 hover:text-red-600 border border-slate-200 hover:border-red-200 text-slate-600 text-xs font-semibold rounded-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Cerrar Sesión</span>
            </button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-grow flex flex-col min-w-0">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
                <h1 class="text-lg font-bold text-slate-800">Control de Inventario General</h1>
                <span id="admin-name" class="text-xs text-brand-600 font-semibold">Admin</span>
            </header>

            <div class="p-6 space-y-6 overflow-y-auto">
                <div class="flex justify-between items-center">
                    <p class="text-xs text-slate-500">Catálogo general de productos y stock</p>
                    <button onclick="openModalProd()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg transition-all">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nuevo Producto</span>
                    </button>
                </div>

                <!-- TABLA INVENTARIO -->
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
                            <tr>
                                <th class="p-3.5">Código</th>
                                <th class="p-3.5">Producto</th>
                                <th class="p-3.5">Categoría</th>
                                <th class="p-3.5">Ubicación</th>
                                <th class="p-3.5">Stock</th>
                                <th class="p-3.5">Precio</th>
                                <th class="p-3.5 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="productos-table-body" class="divide-y divide-slate-100">
                            <!-- Inyección dinámica desde inventario.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL CREAR PRODUCTO -->
    <div id="modal-prod" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">Registrar Producto</h3>
            <form id="form-prod" onsubmit="guardarProducto(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Código</label>
                        <input type="text" id="prod-codigo" placeholder="PROD-01" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Categoría</label>
                        <input type="text" id="prod-categoria" placeholder="Redes" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nombre del Producto</label>
                    <input type="text" id="prod-nombre" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Stock Inicial</label>
                        <input type="number" id="prod-stock" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Precio ($)</label>
                        <input type="number" step="0.01" id="prod-precio" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Ubicación</label>
                    <input type="text" id="prod-ubicacion" placeholder="Almacén A - Pasillo 2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModalProd()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/inventario.js"></script>
</body>
</html>
