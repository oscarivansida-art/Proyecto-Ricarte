<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticación Moderno</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/modo-oscuro.css">
    <script src="js/modo-oscuro.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-700 font-sans antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white bg-slate-100">

    <!-- Toast Notification System Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">

        <!-- ==================== AUTH CONTAINER (LOGIN / REGISTER / RECOVERY) ==================== -->
        <div id="auth-card" class="w-full max-w-md bg-white/90 backdrop-blur-xl border border-slate-200 rounded-2xl shadow-xl shadow-slate-200/70 overflow-hidden transition-all duration-300">
            
            <!-- Auth Header Tabs -->
            <div class="flex border-b border-slate-200 text-center text-sm font-semibold text-slate-500">

            </div>

            <div class="p-6 sm:p-8">
                
                <!-- 1. LOGIN FORM -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">¡Bienvenido de nuevo!</h2>
                        <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder a tu cuenta</p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5" for="login-email">Correo Electrónico</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="login-email" required placeholder="tu@ejemplo.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="text-xs font-medium text-slate-600" for="login-password">Contraseña</label>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none">
                                <i class="fa-solid fa-lock text-xs"></i>
                            </span>
                            <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
                            <button type="button" onclick="togglePasswordVisibility('login-password', 'toggle-login-pwd')" aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-brand-700 focus-visible:text-brand-700">
                                <i id="toggle-login-pwd" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Selección opcional de Rol en el Login para pruebas -->
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5" for="login-role">Ingresar como</label>
                        <select id="login-role" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
                            <option value="admin">Administrador</option>
                            <option value="encargado">Encargado</option>
                        </select>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 bg-slate-50">
                        <label for="remember-me" class="ml-2 text-xs text-slate-500">Recordar esta sesión</label>
                    </div>

                    <button type="submit" id="btn-login-submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2 group">
                        <span>Iniciar Sesión</span>
                        <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <!-- 3. RECOVERY FORM -->
                <form id="form-recovery" onsubmit="handleRecovery(event)" class="space-y-4 hidden">
                    <div class="text-center mb-6">
                        <div class="w-12 h-12 bg-brand-500/10 rounded-full flex items-center justify-center text-brand-500 mx-auto mb-3">
                            <i class="fa-solid fa-key text-lg"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800">¿Olvidaste tu clave?</h2>
                        <p class="text-xs text-slate-500 mt-1">Ingresa tu correo y te enviaremos instrucciones de recuperación.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1" for="rec-email">Correo Registrado</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 pointer-events-none">
                                <i class="fa-regular fa-envelope text-xs"></i>
                            </span>
                            <input type="email" id="rec-email" required placeholder="tu@ejemplo.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
                        </div>
                    </div>

                    <button type="submit" id="btn-recovery-submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                        <span>Enviar Enlace</span>
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>

                    <button type="button" onclick="switchForm('login')" class="w-full text-center text-xs text-slate-500 hover:text-slate-800 transition-colors pt-2 block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Volver a Iniciar Sesión
                    </button>
                </form>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500">
        &copy; Todos los derechos reservados.
    </footer>

    <!-- Enlace a tu script JS en la carpeta js/ -->
    <script src="js/auth.js"></script>
</body>
</html>
