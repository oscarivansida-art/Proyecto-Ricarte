<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Operativo - Encargado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/modo-oscuro.css">
    <script src="../js/modo-oscuro.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="h-full text-slate-700 font-sans bg-slate-100">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4">
            <div>
                <div class="flex items-center gap-3 text-brand-600 font-bold text-lg pb-6 border-b border-slate-200">
                    <i class="fa-solid fa-clipboard-check text-xl"></i>
                    <span>Supervisión</span>
                </div>
                <nav class="flex flex-col gap-1.5 mt-6">
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-500 hover:text-brand-700 hover:bg-brand-50 font-medium text-sm rounded-xl transition-all">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Turno & Operaciones</span>
                    </a>
                    <a href="inventario.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand-50 text-brand-600 font-medium text-sm rounded-xl border border-brand-100">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <span>Inventario / Stock</span>
                    </a>
                    <a href="reporte.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-500 hover:text-brand-700 hover:bg-brand-50 font-medium text-sm rounded-xl transition-all">
                        <i class="fa-solid fa-file-lines"></i>
                        <span>Reporte Diario</span>
                    </a>
                </nav>
            </div>
            <button onclick="logout()" class="w-full py-2.5 px-3 bg-slate-50 hover:bg-red-50 hover:text-red-600 border border-slate-200 hover:border-red-200 text-slate-600 text-xs font-semibold rounded-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Cerrar Sesión</span>
            </button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-grow flex flex-col min-w-0">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
                <h1 class="text-lg font-bold text-slate-800">Ajustes y Conteo de Inventario</h1>
                <span id="encargado-name" class="text-xs text-brand-600 font-semibold">Encargado</span>
            </header>

            <div class="p-6 space-y-6 overflow-y-auto">
                <div class="flex justify-between items-center">
                    <p class="text-xs text-slate-500">Consulta de existencias y registro de entradas/salidas de almacén</p>
                </div>

                <!-- TABLA PRODUCTOS -->
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
                            <tr>
                                <th class="p-3.5">Código</th>
                                <th class="p-3.5">Producto</th>
                                <th class="p-3.5">Ubicación</th>
                                <th class="p-3.5">Stock Actual</th>
                                <th class="p-3.5 text-right">Ajuste Rápido</th>
                            </tr>
                        </thead>
                        <tbody id="stock-table-body" class="divide-y divide-slate-100">
                            <!-- Inyección dinámica desde encargado-inventario.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL AJUSTAR STOCK -->
    <div id="modal-stock" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">Ajuste de Existencias</h3>
            <p id="prod-stock-title" class="text-xs text-brand-600 font-semibold"></p>
            
            <form id="form-stock" onsubmit="guardarAjuste(event)" class="space-y-3">
                <input type="hidden" id="stock-prod-id">
                
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tipo de Movimiento</label>
                    <select id="stock-tipo" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="entrada">Entrada (+)</option>
                        <option value="salida">Salida (-)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Cantidad</label>
                    <input type="number" id="stock-cantidad" min="1" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Observación / Motivo</label>
                    <input type="text" id="stock-obs" placeholder="Ej. Surtido de proveedor / Salida a producción" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModalStock()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">Confirmar Movimiento</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/encargado-inventario.js"></script>
</body>
</html>
